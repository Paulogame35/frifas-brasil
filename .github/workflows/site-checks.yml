name: Site checks

on:
  pull_request:
  push:
    branches:
      - main
      - audit-adsense-reset-2026-10-26

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install HTML test dependency
        run: python -m pip install beautifulsoup4
      - name: Check local links, media and JavaScript syntax
        run: python tests/check_site.py
      - name: Test login and registration UI
        run: node tests/auth-ui.cjs
      - name: Test chat connection recovery
        run: node tests/chat-connection.cjs
      - name: Test chat migration and atomic sends
        run: node tests/chat-migration.cjs
      - name: Test safe public profile photos
        run: node tests/profile-photo.cjs
      - name: Test event period boundaries
        run: node tests/event-period.cjs

