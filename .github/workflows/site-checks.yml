name: Site checks

on:
  pull_request:
  push:
    branches:
      - main
      - audit-adsense-reset-2026-10-26

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install HTML test dependency
        run: python -m pip install beautifulsoup4
      - name: Check local links, media and JavaScript syntax
        run: python tests/check_site.py
      - name: Test event-period status logic
        run: node tests/event-period.cjs
      - name: Test login and registration UI
        run: node tests/auth-ui.cjs
      - name: Test chat connection recovery
        run: node tests/chat-connection.cjs
      - name: Install Firestore rules test dependencies
        run: npm install --no-save firebase@12.19.0 @firebase/rules-unit-testing@4 firebase-tools
      - name: Test Firestore security rules
        run: npx firebase emulators:exec --only firestore --project demo-frifas --config firebase/firebase.json "node firebase/rules-test.cjs"
