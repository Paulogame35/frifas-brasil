name: Site checks

on:
  pull_request:
  push:
    branches:
      - main
      - audit-adsense-reset-2026-10-26
      - fix/editorial-refresh-and-event-status-2026-11-11

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Set up Java for the Firestore emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Firebase test dependencies
        run: npm install --no-save --package-lock=false firebase @firebase/rules-unit-testing firebase-tools
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install HTML test dependency
        run: python -m pip install beautifulsoup4
      - name: Check local links, media and JavaScript syntax
        run: python tests/check_site.py
      - name: Test editorial homepage, event labels and archive preservation
        run: node tests/editorial-regression.cjs
      - name: Test Firestore security rules in the emulator
        run: ./node_modules/.bin/firebase emulators:exec --only firestore --project demo-frifas --config firebase/firebase.json "node firebase/rules-test.cjs"
      - name: Test login and registration UI
        run: node tests/auth-ui.cjs
      - name: Test chat connection recovery
        run: node tests/chat-connection.cjs
      - name: Test chat migration and atomic sends
        run: node tests/chat-migration.cjs
      - name: Test safe public profile photos
        run: node tests/profile-photo.cjs
      - name: Test event period boundaries
        run: node tests/event-period.cjs

