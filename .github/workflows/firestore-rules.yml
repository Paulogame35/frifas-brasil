name: Firestore security rules

on:
  push:
    paths:
      - 'firebase/**'
      - '.github/workflows/firestore-rules.yml'
  pull_request:
    paths:
      - 'firebase/**'
      - '.github/workflows/firestore-rules.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firestore-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Firebase test dependencies
        run: npm install --no-save --package-lock=false firebase @firebase/rules-unit-testing firebase-tools
      - name: Test Firestore security rules in the emulator
        run: ./node_modules/.bin/firebase emulators:exec --only firestore --project demo-frifas --config firebase/firebase.json "node firebase/rules-test.cjs"
