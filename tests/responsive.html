<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Verificação responsiva — FRIFAS BRASIL</title><style>body{margin:0;background:#24272d;color:#fff;font:15px system-ui}header{padding:16px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}select,button{padding:10px;font:inherit}iframe{display:block;margin:0 auto;border:1px solid #aaa;height:780px;background:#090a0c}output{display:block;padding:12px;text-align:center}label{display:flex;align-items:center;gap:8px}</style></head><body><header><label>Página<select id="page"><option value="index.html">Início</option><option value="noticias.html">Notícias</option><option value="login.html">Login</option><option value="cadastro.html">Cadastro</option><option value="comunidade.html">Comunidade</option><option value="campeonatos.html">Campeonatos</option><option value="free-fire-controle-parental-13-outubro-2026.html">Matéria</option></select></label><label>Largura<select id="width"><option>360</option><option>390</option><option>768</option><option>1280</option></select></label><button id="check">Conferir layout</button></header><output id="result" role="status">Carregando…</output><iframe id="preview" title="Prévia do site" width="360" src="../index.html"></iframe><script>
const frame=document.querySelector('#preview'),page=document.querySelector('#page'),width=document.querySelector('#width'),result=document.querySelector('#result');
function check(){const d=frame.contentDocument;if(!d?.body)return;const v=d.documentElement.clientWidth;const overflow=Math.max(d.body.scrollWidth,d.documentElement.scrollWidth)>v+1;const broken=[...d.images].filter(im=>im.complete&&!im.naturalWidth&&!im.src.includes('pinterest')).length;result.textContent=page.selectedOptions[0].text+': '+v+' px — '+(overflow?'ERRO: rolagem horizontal':'sem rolagem horizontal')+'; '+broken+' imagens com falha.';}
page.addEventListener('change',()=>{result.textContent='Carregando…';frame.src='../'+page.value});width.addEventListener('change',()=>{frame.width=width.value;requestAnimationFrame(check)});frame.addEventListener('load',check);document.querySelector('#check').addEventListener('click',check);
</script></body></html>
