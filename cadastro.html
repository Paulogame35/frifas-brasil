<body class="authBody">
<main class="authShell">
<a class="authBrand" href="index.html" aria-label="Voltar para o FRIFAS BRASIL"><img src="assets/img/frifas-logo.svg" alt="FRIFAS BRASIL" width="164" height="41"></a>
<section class="authCard" aria-labelledby="registerTitle">
<span class="authEyebrow">CONTA FRIFAS</span>
<h1 id="registerTitle">Criar conta</h1>
<p class="authSubtitle">Crie sua conta com e-mail e senha para entrar no FRIFAS BRASIL.</p>

<form id="registerForm" novalidate>
<label for="email">E-mail</label>
<input type="email" id="email" name="email" autocomplete="email" inputmode="email" placeholder="seu@email.com" required>

<label for="password">Senha</label>
<div class="passwordField"><input type="password" id="password" name="password" autocomplete="new-password" placeholder="Mínimo de 6 caracteres" minlength="6" required><button type="button" id="togglePassword" class="passwordToggle" aria-label="Mostrar senha">Mostrar</button></div>

<label for="confirmPassword">Confirmar senha</label>
<div class="passwordField"><input type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password" placeholder="Digite a senha novamente" minlength="6" required><button type="button" id="toggleConfirmPassword" class="passwordToggle" aria-label="Mostrar confirmação de senha">Mostrar</button></div>

<button type="submit" id="btnCadastro" class="authPrimary">Criar minha conta</button>
</form>

<div class="authDivider"><span>ou</span></div>
<button type="button" id="btnGoogle" class="authGoogle"><span class="googleMark" aria-hidden="true">G</span>Criar conta com Google</button>

<p id="status" class="authStatus" role="status" aria-live="polite"></p>
<p class="authSwitch">Já tem uma conta? <a href="login.html">Entrar</a></p>
<a class="backSite" href="index.html">← Voltar para o site</a>
</section>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, GoogleAuthProvider, signInWithRedirect, getRedirectResult, setPersistence, browserLocalPersistence, sendEmailVerification } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyA-Ti0SOVjh0s8_8rh6SIrP1A9WHYSo6Rs",
  authDomain: "freefas-d0a9e.firebaseapp.com",
  projectId: "freefas-d0a9e",
  storageBucket: "freefas-d0a9e.firebasestorage.app",
  messagingSenderId: "251003895899",
  appId: "1:251003895899:web:083e03360c682217853f7e"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();
try{await setPersistence(auth,browserLocalPersistence)}catch(e){}
try{const redirected=await getRedirectResult(auth);if(redirected?.user){location.replace("perfil.html?welcome=1");}}catch(err){document.addEventListener("DOMContentLoaded",()=>{const s=document.getElementById("status");if(s)s.textContent="Não foi possível concluir o cadastro com Google.";});}

const form=document.getElementById("registerForm");
const email=document.getElementById("email");
const password=document.getElementById("password");
const confirmPassword=document.getElementById("confirmPassword");
const googleButton=document.getElementById("btnGoogle");
const togglePassword=document.getElementById("togglePassword");
const toggleConfirmPassword=document.getElementById("toggleConfirmPassword");
const status=document.getElementById("status");

function bindToggle(button,input){button.addEventListener("click",()=>{const show=input.type==="password";input.type=show?"text":"password";button.textContent=show?"Ocultar":"Mostrar";button.setAttribute("aria-label",show?"Ocultar senha":"Mostrar senha");});}
bindToggle(togglePassword,password);bindToggle(toggleConfirmPassword,confirmPassword);

function setStatus(message,type="error"){
  status.textContent=message;
  status.dataset.type=type;
}
function friendlyError(code){
  if(code==="auth/email-already-in-use") return "Este e-mail já possui uma conta.";
  if(code==="auth/invalid-email") return "Digite um e-mail válido.";
  if(code==="auth/weak-password") return "Use uma senha mais forte, com pelo menos 6 caracteres.";
  if(code==="auth/operation-not-allowed") return "Este método de cadastro ainda não foi ativado no Firebase.";
  if(code==="auth/unauthorized-domain") return "Este domínio ainda não foi autorizado no Firebase.";
  return "Não foi possível criar a conta agora. Tente novamente.";
}

form.addEventListener("submit",async(e)=>{
  e.preventDefault();
  setStatus("");
  const mail=email.value.trim();
  if(!mail){setStatus("Digite seu e-mail.");return;}
  if(password.value.length<6){setStatus("A senha precisa ter pelo menos 6 caracteres.");return;}
  if(password.value!==confirmPassword.value){setStatus("As duas senhas precisam ser iguais.");return;}
  try{
    const credential=await createUserWithEmailAndPassword(auth,mail,password.value);
    try{await sendEmailVerification(credential.user);}catch(e){}
    setStatus("Conta criada. Enviamos um e-mail de confirmação para você.","success");
    setTimeout(()=>location.replace("perfil.html?welcome=1"),900);
  }catch(err){setStatus(friendlyError(err.code));}
});

googleButton.addEventListener("click",async()=>{
  setStatus("");
  try{
    setStatus("Abrindo o Google...","success");
    await signInWithRedirect(auth,provider);
  }catch(err){setStatus(friendlyError(err.code));}
});
</script>
</body>
</html>
