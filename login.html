<body class="authBody">
<main class="authShell">
<a class="authBrand" href="index.html" aria-label="Voltar para o FRIFAS BRASIL"><img src="assets/img/frifas-logo.svg" alt="FRIFAS BRASIL" width="164" height="41"></a>
<section class="authCard" aria-labelledby="loginTitle">
<span class="authEyebrow">CONTA FRIFAS</span>
<h1 id="loginTitle">Entrar</h1>
<p class="authSubtitle">Acesse sua conta para usar os recursos de usuário do FRIFAS BRASIL.</p>

<form id="loginForm" novalidate>
<label for="email">E-mail</label>
<input type="email" id="email" name="email" autocomplete="email" inputmode="email" placeholder="seu@email.com" required>

<div class="labelRow"><label for="password">Senha</label><button type="button" id="resetPassword" class="textButton">Esqueci a senha</button></div>
<div class="passwordField"><input type="password" id="password" name="password" autocomplete="current-password" placeholder="Sua senha" minlength="6" required><button type="button" id="togglePassword" class="passwordToggle" aria-label="Mostrar senha">Mostrar</button></div>

<button type="submit" id="btnLogin" class="authPrimary">Entrar</button>
</form>

<div class="authDivider"><span>ou</span></div>

<button type="button" id="btnGoogle" class="authGoogle"><span class="googleMark" aria-hidden="true">G</span>Continuar com Google</button>

<p id="status" class="authStatus" role="status" aria-live="polite"></p>
<p class="authSwitch">Não tem uma conta? <a href="cadastro.html">Criar conta</a></p>
<a class="backSite" href="index.html">← Voltar para o site</a>
</section>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, GoogleAuthProvider, signInWithRedirect, getRedirectResult, sendPasswordResetEmail, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyA-Ti0SOVjh0s8_8rh6SIrP1A9WHYSo6Rs",
  authDomain: "freefas-d0a9e.firebaseapp.com",
  projectId: "freefas-d0a9e",
  storageBucket: "freefas-d0a9e.firebasestorage.app",
  messagingSenderId: "251003895899",
  appId: "1:251003895899:web:083e03360c682217853f7e"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();
try{await setPersistence(auth,browserLocalPersistence)}catch(e){console.error("Persistência:",e)}


const form = document.getElementById("loginForm");
const email = document.getElementById("email");
const password = document.getElementById("password");
const googleButton = document.getElementById("btnGoogle");
const resetButton = document.getElementById("resetPassword");
const togglePassword = document.getElementById("togglePassword");
const status = document.getElementById("status");
const next=new URLSearchParams(location.search).get("next");
const safeNext=next&&/^[a-z0-9._-]+\.html(?:\?.*)?$/i.test(next)?next:"index.html";

togglePassword.addEventListener("click",()=>{const show=password.type==="password";password.type=show?"text":"password";togglePassword.textContent=show?"Ocultar":"Mostrar";togglePassword.setAttribute("aria-label",show?"Ocultar senha":"Mostrar senha");});

function setStatus(message,type="error"){
  status.textContent=message;
  status.dataset.type=type;
}
function friendlyError(code){
  if(code==="auth/invalid-credential"||code==="auth/wrong-password"||code==="auth/user-not-found") return "E-mail ou senha incorretos.";
  if(code==="auth/invalid-email") return "Digite um e-mail válido.";
  if(code==="auth/too-many-requests") return "Muitas tentativas. Aguarde um pouco e tente novamente.";
  if(code==="auth/popup-closed-by-user") return "Login com Google cancelado.";
  if(code==="auth/popup-blocked") return "O navegador bloqueou a janela do Google. Permita pop-ups e tente novamente.";
  if(code==="auth/operation-not-allowed") return "Este método de login ainda não foi ativado no Firebase.";
  if(code==="auth/unauthorized-domain") return "Este domínio ainda não foi autorizado no Firebase.";
  if(code==="auth/session-not-persisted") return "O login foi aceito, mas a sessão não ficou salva no navegador. Tente novamente.";
  return "Não foi possível entrar agora. Tente novamente.";
}

form.addEventListener("submit",async(e)=>{
  e.preventDefault();
  setStatus("");
  if(!email.value.trim()||!email.validity.valid||password.value.length<6){setStatus("Confira seu e-mail e informe uma senha com pelo menos 6 caracteres.");return;}
  try{
    googleButton.disabled=true;
    document.getElementById("btnLogin").disabled=true;
    const credential=await signInWithEmailAndPassword(auth,email.value.trim(),password.value);
    if(!credential.user)throw Object.assign(new Error("Sessão não criada"),{code:"auth/session-not-persisted"});
    setStatus("Login confirmado. Abrindo sua conta...","success");
    location.replace(safeNext);
  }catch(err){setStatus(friendlyError(err.code));googleButton.disabled=false;document.getElementById("btnLogin").disabled=false;}
});

try{
  const redirected=await getRedirectResult(auth);
  if(redirected?.user){
    setStatus("Login com Google confirmado. Abrindo sua conta...","success");
    location.replace(safeNext);
  }
}catch(err){setStatus(friendlyError(err.code));}

googleButton.addEventListener("click",async()=>{
  setStatus("Abrindo o Google...","success");
  try{
    await signInWithRedirect(auth,provider);
  }catch(err){setStatus(friendlyError(err.code));}
});

resetButton.addEventListener("click",async()=>{
  const value=email.value.trim();
  if(!value||!email.validity.valid){setStatus("Digite um e-mail válido para receber o link de recuperação.");return;}
  try{
    await sendPasswordResetEmail(auth,value);
    setStatus("Enviamos um link de recuperação para seu e-mail.","success");
  }catch(err){setStatus(friendlyError(err.code));}
});
</script>
</body>
</html>
