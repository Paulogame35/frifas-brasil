<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#090a0c"><title>Painel editorial — FRIFAS BRASIL</title><link rel="icon" type="image/svg+xml" href="favicon.svg"><link rel="stylesheet" href="style.css?v=20261003-clean2"><style>
.adminShell{width:min(900px,calc(100% - 32px));margin:48px auto 90px}.adminHead{margin-bottom:28px}.adminHead h1{font-size:clamp(36px,6vw,58px);margin:8px 0}.adminHead p,.adminHint{color:var(--muted)}.adminCard{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);padding:28px}.adminGrid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.adminField{display:flex;flex-direction:column;gap:7px}.adminField.full{grid-column:1/-1}.adminField label{font-size:12px;font-weight:900}.adminField input,.adminField select,.adminField textarea{width:100%;border:1px solid #343942;border-radius:9px;background:#0b0d10;color:#fff;padding:13px;font:inherit}.adminField textarea{min-height:180px;resize:vertical}.adminActions{display:flex;gap:12px;align-items:center;margin-top:22px}.adminStatus{color:var(--muted)}.adminLocked{text-align:center;padding:40px}.adminLocked a{color:var(--accent);font-weight:900}@media(max-width:650px){.adminGrid{grid-template-columns:1fr}.adminField.full{grid-column:auto}.adminCard{padding:20px}}
</style></head><body><header class="siteHeader"><div class="headerInner"><a class="brand" href="index.html"><img src="assets/img/frifas-logo.svg" alt="FRIFAS BRASIL" width="136" height="34"></a></div></header><main class="adminShell"><div class="adminHead"><span class="eyebrow">PAINEL PRIVADO</span><h1>Publicar novidade</h1><p>Área editorial do proprietário do FRIFAS BRASIL.</p></div><section id="locked" class="adminCard adminLocked">Verificando acesso...</section><section id="editor" class="adminCard" hidden><form id="postForm"><div class="adminGrid"><div class="adminField full"><label for="title">Título</label><input id="title" maxlength="120" required></div><div class="adminField"><label for="category">Categoria</label><select id="category"><option>Notícias</option><option>Atualizações</option><option>Eventos</option><option>Campeonatos</option></select></div><div class="adminField"><label for="statusType">Situação</label><select id="statusType"><option value="official">Oficial / confirmado</option><option value="reported">Reportado / a confirmar</option></select></div><div class="adminField full"><label for="image">Imagem oficial (URL)</label><input id="image" type="url" placeholder="https://..." required></div><div class="adminField full"><label for="summary">Resumo</label><textarea id="summary" maxlength="320" style="min-height:100px" required></textarea></div><div class="adminField full"><label for="body">Texto da matéria</label><textarea id="body" required></textarea></div><div class="adminField full"><label for="source">Fonte</label><input id="source" type="url" placeholder="https://..." required></div></div><div class="adminActions"><button class="btn primary" id="publish" type="submit">Publicar</button><span id="status" class="adminStatus"></span></div></form><p class="adminHint">Use imagem oficial da Garena/Free Fire quando houver. Conteúdo ainda não confirmado deve ser marcado como reportado.</p></section></main>
<script type="module">
import{initializeApp,getApps,getApp}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import{getAuth,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import{getFirestore,collection,addDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
const config={apiKey:"AIzaSyA-Ti0SOVjh0s8_8rh6SIrP1A9WHYSo6Rs",authDomain:"freefas-d0a9e.firebaseapp.com",projectId:"freefas-d0a9e",storageBucket:"freefas-d0a9e.firebasestorage.app",messagingSenderId:"251003895899",appId:"1:251003895899:web:083e03360c682217853f7e"};
const app=getApps().length?getApp():initializeApp(config),auth=getAuth(app),db=getFirestore(app);
const OWNER_UID="tazzSkynJVPV0njHFCgRFveLcGV2",locked=document.querySelector("#locked"),editor=document.querySelector("#editor"),form=document.querySelector("#postForm"),status=document.querySelector("#status"),publish=document.querySelector("#publish");
onAuthStateChanged(auth,u=>{if(!u){locked.innerHTML='Entre primeiro na sua conta. <a href="login.html?next=admin.html">Entrar</a>';return}if(u.uid!==OWNER_UID){locked.textContent="Acesso restrito ao proprietário.";return}locked.hidden=true;editor.hidden=false});
form.addEventListener("submit",async e=>{e.preventDefault();const u=auth.currentUser;if(!u||u.uid!==OWNER_UID)return;publish.disabled=true;status.textContent="Publicando...";try{await addDoc(collection(db,"editorialPosts"),{title:document.querySelector("#title").value.trim(),category:document.querySelector("#category").value,statusType:document.querySelector("#statusType").value,image:document.querySelector("#image").value.trim(),summary:document.querySelector("#summary").value.trim(),body:document.querySelector("#body").value.trim(),source:document.querySelector("#source").value.trim(),authorUid:u.uid,publishedAt:serverTimestamp(),published:true});form.reset();status.textContent="Publicado no banco editorial."}catch(err){status.textContent=err?.code==="permission-denied"?"O Firestore ainda precisa liberar a coleção editorialPosts para o proprietário.":"Não foi possível publicar agora."}finally{publish.disabled=false}});
</script></body></html>
